name: Validate plugin marketplace

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check marketplace, manifests and skills
        run: python3 scripts/validate_repo.py

      - name: Check Agent Plugins v1.0.0 conformance
        run: python3 scripts/check_agent_plugins.py
